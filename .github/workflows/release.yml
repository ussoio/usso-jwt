# Automated release for usso-jwt on version tags (e.g. 0.2.12).
# Syncs pyproject.toml version from the tag, commits to main, then publishes.

name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Sync pyproject.toml version from tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          path = pathlib.Path("pyproject.toml")
          text = path.read_text()
          updated, count = re.subn(
              r'(?m)^(version\s*=\s*")[^"]*(")',
              rf"\g<1>{version}\2",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("failed to update version in pyproject.toml")
          path.write_text(updated)
          print(f"pyproject.toml version -> {version}")
          PY

      - name: Commit version bump to main
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- pyproject.toml; then
            echo "pyproject.toml already at ${VERSION}; skipping commit"
          else
            git add pyproject.toml
            git commit -m "chore(release): ${VERSION}"
            git push origin HEAD:main
          fi

      - name: Install build dependencies
        run: python -m pip install -U setuptools wheel build

      - name: Install test dependencies
        run: |
          python -m pip install -U pytest pytest-cov
          python -m pip install -e .

      - name: Run tox (tests, lint, coverage)
        run: |
          python -m pip install -U tox
          tox

      - name: Build
        run: python -m build .

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
